      /* Entry overlay: w/ prompt and dot to click in */
      .entry-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        z-index: 888;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: auto;
        background-color: rgba(247, 247, 237, 0.95);
        opacity: 1; /* Fully visible */
        transition: opacity 1.5s ease; /* Smooth fade-out effect */
      }
      .hidden-entry-overlay {
        opacity: 0;
        pointer-events: none; /* Prevent interaction */
      }
      #entry-dot {
        width: 15px;
        height: 15px;
        background-color: transparent;
        border: 1px solid black;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.5s ease; /* Smooth fade-out effect */

      .prompt-text {
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 14px;
        font-style: normal;
        font-variation-settings: "wdth" 87.5;
        color: black;
      }

      .dot-nav {
        height: 100px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        position: relative;
        padding: 20px;
      }

      .dot {
        position: absolute;
        height: 15px;
        width: 15px;
        background-color: transparent;
        border: 1px solid black;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
      }

      /* Positioning the dots in a triangle formation */
      #dot1 {
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }

      #dot1::after {
        content: "Rolodex Homepage";
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 10px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(10%);
        background-color: black;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        z-index: 15;
      }

      #dot1:hover::after {
        opacity: 1;
      }

      #dot2 {
        top: 60px;
        left: calc(50% - 30px);
      }

        content: "Emilia Wee Van's Bio";

        font-weight: 300;
        font-size: 10px;

        padding: 5px 10px;
        border-radius: 5px;

      /**
       * Formats a number to always have two digits (e.g., 5 -> "05")
       */
      function padZero(num) {
        return num.toString().padStart(2, "0");
      }

      /**
       * Updates the UTC clock every second
       */
      function updateUTCClock() {
        try {
          const now = new Date();
          const hours = padZero(now.getUTCHours());
          const minutes = padZero(now.getUTCMinutes());
          const seconds = padZero(now.getUTCSeconds());
          document.getElementById("utcClock").textContent =
            `${hours}:${minutes}:${seconds} UTC`;
        } catch (error) {
          console.error("Error updating UTC clock:", error);
          document.getElementById("utcClock").textContent = "Error";
        }
      }

      // Initial call and set interval for updates
      updateUTCClock();
      setInterval(updateUTCClock, 1000);

      // JS for EWVan design
      // constants and vars for EWVan
      var greenOnTable = false;
      var whiteOnTable = false;
      var blackOnTable = false;
      var allOnTable = false;
      const textContentArr = [
        {
          time: 12000,
          text: "Meet, meat.\nAnd guess who she is marrying –\nShe’s marrying a snake!\nThere was a bird flying above, also going to the wedding…\nThen she threw the meat, and there was the snake, eating it.\nThey married, and in the place where they married, there was a tree, standing.\nThat was my latest one, that was my latest one.",
        },
        {
          time: 14000,
          text: "My second latest one was this one.\nThis one doesn’t hold a story. It is like a flower.\nIf you look really closely, you can see little cracks.\nI purposely did this – with a special type of white and thick liquid.\nI didn’t want to put it here, because I didn’t want to cover this, so I only put it on the sides.\nYou can make many small cracks. With many varieties of clay.  You know that right?\nFor this one, I used black clay and white clay. The black clay is softer than the white clay.",
        },
        {
          time: 6000,
          text: "I use all my fingers to make these pieces. And a lot of wrist.\nI am giving these ones away, only to my best friends or to my family.",
        },
        {
          time: 10000,
          text: "This time, I am using a different combination of clays to make a plant holder.\nYellow clay and white clay. Yellow clay is dark yellow, but when you fire it in the kiln,\nIt becomes red. If you mix yellow and white clay, then the final red will lighten.",
        },
        {
          time: 10000,
          text: "This is the procession: first you get your clay.\nYou do whatever you want with the clay.\nThen you have to fire it. Then you need to colour it.\nThen you have to fire it. Then you have to wash it.\nAfter that, you can take it home because it’s done.",
        },
        {
          time: 6000,
          text: "This one took three weeks, almost a month to complete.\nCeramics take up a lot of your time. It’s like you’re wasting your time.\nKneading and making your clay look good. ",
        },
      ];
      let textCounter = 0;
      const paraContent = document.getElementById("text-content");
      const audioA = document.getElementById("audio-A");
      const audioB = document.getElementById("audio-B");
      const audioC = document.getElementById("audio-C");
      const audioD = document.getElementById("audio-D");

      function autoplay() {
        nextText(textCounter);
        setTimeout(function () {
          if (textCounter === textContentArr.length - 1) {
            textCounter = 0;
          } else {
            textCounter++;
          }
          autoplay();
        }, textContentArr[textCounter].time);
      }

      function nextText(num) {
        paraContent.textContent = textContentArr[num].text;
      }

      // Make ref-images draggable stickers
      var refImages = document.getElementsByClassName("pot");
      for (let i = 0; i < refImages.length; i++) {
        dragElement(refImages[i]);
      }

      function dragElement(elmnt) {
        var pos1 = 0,
          pos2 = 0,
          pos3 = 0,
          pos4 = 0;
        if (document.getElementById(elmnt.id + "header")) {
          // if present, the header is where you move the DIV from:
          document.getElementById(elmnt.id + "header").onmousedown =
            dragMouseDown;
        } else {
          // otherwise, move the DIV from anywhere inside the DIV:
          elmnt.onmousedown = dragMouseDown;
        }

        function dragMouseDown(e) {
          e = e || window.event;
          e.preventDefault();
          // get the mouse cursor position at startup:
          pos3 = e.clientX;
          pos4 = e.clientY;
          document.onmouseup = closeDragElement;
          // call a function whenever the cursor moves:
          document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
          e = e || window.event;
          e.preventDefault();
          // calculate the new cursor position:
          pos1 = pos3 - e.clientX;
          pos2 = pos4 - e.clientY;
          pos3 = e.clientX;
          pos4 = e.clientY;
          // set the element's new position:
          elmnt.style.top = elmnt.offsetTop - pos2 + "px";
          elmnt.style.left = elmnt.offsetLeft - pos1 + "px";

          // Define scaling factor: starts at 1, increases with scroll
          // Adjust divisor to control sensitivity
          let scale = 1 + (elmnt.offsetTop - pos2 - 190) / 1000;
          // Limit maximum scale to avoid excessive growth
          if (scale > 2) scale = 2;
          elmnt.style.transform = `scale(${scale})`;

          if (
            370 < elmnt.offsetTop - pos2 &&
            elmnt.offsetTop - pos2 < 650 &&
            730 < elmnt.offsetLeft - pos1 &&
            elmnt.offsetLeft - pos1 < 1220
          ) {
            document.getElementById("table").setAttribute("fill", "#E9F35D");
            paraContent.style.display = "none";
            if (elmnt.id === "green") {
              greenOnTable = true;
              audioC.play();
            } else if (elmnt.id === "white") {
              whiteOnTable = true;
              audioA.play();
            } else if (elmnt.id === "black") {
              blackOnTable = true;
              audioB.play();
            }
            if (greenOnTable && whiteOnTable && blackOnTable) {
              allOnTable = true;
              audioC.pause();
              audioA.pause();
              audioB.pause();
              audioD.play();
            }
            //TODO: audio equations, play audio!
          } else {
            if (allOnTable === true) {
            }
            if (elmnt.id === "green") {
              greenOnTable = false;
              audioC.pause();
              if (allOnTable === true) {
                audioB.play();
                audioA.play();
                audioD.pause();
                allOnTable = false;
              }
            } else if (elmnt.id === "white") {
              whiteOnTable = false;
              audioA.pause();
              if (allOnTable === true) {
                audioB.play();
                audioC.play();
                audioD.pause();
                allOnTable = false;
              }
            } else if (elmnt.id === "black") {
              blackOnTable = false;
              audioB.pause();
              if (allOnTable === true) {
                audioA.play();
                audioC.play();
                audioD.pause();
                allOnTable = false;
              }
            }
            if (!greenOnTable && !whiteOnTable && !blackOnTable) {
              document.getElementById("table").setAttribute("fill", "none");
              paraContent.style.display = "block";
            }
          }
        }
        function closeDragElement() {
          // stop moving when mouse button is released:
          document.onmouseup = null;
          document.onmousemove = null;
        }
      }

      window.onload = function () {
        autoplay();
      };
    </script>
  </body>
</html>
