<!doctype html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wdth,wght@0,62.5..100,100..900;1,62.5..100,100..900&display=swap"
    rel="stylesheet" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuchen Chang & Dong Xing</title>
  <style>
    p {
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 200;
      font-size: 14px;
      font-style: normal;
      font-variation-settings: "wdth" 100;
      color: black;
    }

    input[type="range"] {
      -webkit-appearance: none;
      /* Clear out default styles */
      appearance: none;
      background: transparent;
      cursor: pointer;

    }

    /* Entry overlay: w/ prompt and dot to click in */
    .entry-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      z-index: 888;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background-color: rgba(247, 247, 237, 0.95);
      opacity: 1;
      /* Fully visible */
      transition: opacity 1.5s ease;
      /* Smooth fade-out effect */
    }

    .hidden-entry-overlay {
      opacity: 0;
      pointer-events: none;
      /* Prevent interaction */
      transition: opacity 1s ease;
    }

    .prompt-text {
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-size: 15px;
      font-style: normal;
      font-variation-settings: "wdth" 87.5;
      color: black;
    }

    #entry-dot {
      width: 15px;
      height: 15px;
      background-color: transparent;
      border: 1px solid black;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.5s ease;
      /* Smooth fade-out effect */
    }

    #prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease;
    }

    #loading {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      transition: opacity 1s ease;
    }

    .loader-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pulsing-circle {
      width: 15px;
      height: 15px;
      background-color: #595959;
      border-radius: 50%;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }
    }

    .dot-nav {
      height: 100px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      position: relative;
      border: none;
      /* z-index: 900; */
      /* padding: 20px; */
    }

    .dot {
      position: absolute;
      height: 15px;
      width: 15px;
      background-color: transparent;
      border: 1px solid black;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    /* Positioning the dots in a triangle formation */
    #dot1 {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    #dot1::after {
      content: "Rolodex Homepage";
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-size: 10px;
      font-style: normal;
      font-variation-settings: "wdth" 100;
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(10%);
      background-color: black;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
      z-index: 15;
    }

    #dot1:hover::after {
      opacity: 1;
    }

    #dot2 {
      top: 60px;
      left: calc(50% - 30px);
      background-color: black;
    }

    #dot2::after {
      content: "Yuchen Chang & Dong Xing's Bio";
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-size: 10px;
      font-style: normal;
      font-variation-settings: "wdth" 100;
      font-optical-sizing: auto;
      font-weight: 300;
      font-style: normal;
      font-variation-settings: "wdth" 100;
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-110%);
      background-color: black;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
      z-index: 15;
    }

    #dot2:hover::after {
      opacity: 1;
    }

    #dot3 {
      top: 60px;
      left: calc(50% + 15px);
      background-color: transparent;
    }

    #dot3::after {
      content: "Refresh Content";
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-size: 10px;
      font-style: normal;
      font-variation-settings: "wdth" 100;
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(10%);
      background-color: black;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
      z-index: 15;
    }

    #dot3:hover::after {
      opacity: 1;
    }

    body {
      background: #f7f7ed;
      color: #666;
      text-align: center;
    }

    #img-A,
    #img-B,
    #img-mid {
      transition: linear;
      /* position: relative; */
      padding-top: 35vh;
    }

    #img-A {
      width: 14vw;
      /* left: 46vw; */
    }

    #img-mid {
      width: 19.5vw;
      /* left: 50vw; */
    }

    #img-B {
      width: 14.5vw;
      /* left: 64.5vw; */
    }

    ul {
      padding: 0;
    }

    .overlay {
      opacity: 1;
      background: linear-gradient(0deg,
          rgba(247, 247, 237, 1) 0%,
          rgba(247, 247, 237, 0) 60%,
          rgba(247, 247, 237, 0) 63%,
          rgba(247, 247, 237, 1) 98%);
      /* background-color: black; */
      height: 100%;
      width: 100%;
      z-index: 100;
      position: fixed;
      left: 0;
      top: 0;
    }

    #side-A {
      position: absolute;
      left: 26vw;
      top: 10vh;
    }

    #side-B {
      position: absolute;
      right: 26vw;
      top: 10vh;
    }

    #side-A-text,
    #side-B-text {
      opacity: 1;
      transition: opacity 0.3s ease;
      /* Smooth fade-out effect */
    }

    #needle-A {
      position: absolute;
      left: 20vw;
      top: 38vh;
    }

    #needle-B {
      position: absolute;
      right: 20vw;
      top: 38vh;
    }

    /* custom audio controls css */
    .hidden {
      display: none;
    }

    .player {
      max-width: 500px;
      margin: 7rem auto;
      background: white;
      padding: 36px 32px 24px 32px;
      border-radius: 14px;
      box-shadow:
        0 20px 25px -5px rgb(0 0 0 / 0.1),
        0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    .player-track-meta {
      text-align: center;
    }

    .player-track-meta p {
      margin: 0;
      font-size: 20px;
      color: #0e0e0e;
      font-weight: 700;
    }

    .player-track-meta span {
      font-size: 16px;
      font-weight: 400;
      padding: 0 2px;
      position: relative;
      top: 1px;
      color: #a3a3a3;
    }

    .player-controls-A,
    .player-controls-B {
      display: flex;
      align-items: center;
      width: 18vw;
      position: absolute;
      z-index: 999;
    }

    .player-controls-A {
      top: 3vh;
      left: 2vw;
    }

    .player-controls-B {
      top: 3vh;
      right: 2vw;
    }

    .player-play-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 18px;
      height: 18px;
    }

    .icon-container {
      fill: transparent;
      stroke: none;
    }

    .player-play-btn:hover {
      fill: #444444;
    }

    .player-play-btn svg {
      color: #0e0e0e;
      position: relative;
      left: 0.5px;
      width: 18px;
      height: 18px;
      display: block;
    }

    .player-play-btn:hover svg {
      color: #ffffff;
    }

    .player-timeline {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      padding-left: 10px;
    }

    .player-progress {
      display: flex;
      position: relative;
      height: 4px;
      background: #a3a3a3;
      border-radius: 25px;
      margin: 0 5px;
      flex: 10;
      flex-basis: 100%;
      overflow: hidden;
    }

    .player-progress-filled {
      height: 4px;
      background: #0e0e0e;
      flex: 0;
      flex-basis: 0%;
      border-radius: 25px;
    }

    .player-time {
      padding: 2px 5px;
      font-family: "Noto Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 200;
      font-size: 14px;
      font-style: normal;
      font-variation-settings: "wdth" 100;
    }

    #volume-icon {
      width: 20px;
    }

    .player-volume-container {
      width: 5vw;
      margin: 0px 1vw 0px 1vw;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }

    .player-volume {
      height: 4px;
      /* -webkit-appearance: none; */
      margin: 10px 0;
      width: 100%;
      background: transparent;
      padding-left: 5px;
    }

    .player-volume:focus {
      outline: none;
    }

    .player-volume::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      animation: 0.2s;
      background: #0e0e0e;
      border-radius: 5px;
    }

    .player-volume::-webkit-slider-thumb {
      height: 10px;
      width: 10px;
      border-radius: 5px;
      border: none;
      background: #0e0e0e;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -2.5px;
    }

    .player-volume:focus::-webkit-slider-runnable-track {
      background: #0e0e0e;
    }

    .player-volume::-moz-range-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      animation: 0.2s;
      background: #0e0e0e;
      border-radius: 5px;
    }

    .player-volume::-moz-range-thumb {
      height: 10px;
      width: 10px;
      border-radius: 100px;
      border: none;
      background: #0e0e0e;
      cursor: pointer;
      margin-top: -2.5px;
    }

    .player-volume::-ms-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      animation: 0.2s;
      background: #0e0e0e;
      border-radius: 5px;
    }

    .player-volume::-ms-fill-lower {
      background: #0e0e0e;
      border-radius: 5px;
    }

    .player-volume::-ms-fill-upper {
      background: #0e0e0e;
      border-radius: 5px;
    }

    .player-volume::-ms-thumb {
      margin-top: -2.5px;
      height: 10px;
      width: 10px;
      border-radius: 5px;
      border: none;
      background: #0e0e0e;
      cursor: pointer;
    }

    .player-volume:focus::-ms-fill-lower {
      background: #38bdf8;
    }

    .player-volume:focus::-ms-fill-upper {
      background: #38bdf8;
    }

    .flip {
      transform: scaleX(-1);
    }

    .container {
      height: 97vh;
      width: 100%;
      z-index: 0;
      position: absolute;
      left: 0%;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      justify-content: center;
    }

    #content-before-loading {
      text-align: center;
      display: none;
      font-size: 16px;
      margin-top: 20px;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
    }
  </style>
</head>

<body>

    <div id="prompt" class="hidden-entry-overlay">
      <p class="prompt-text">ON FRIENDSHIP | MOMENT TO MOMENT</p>
      <div id="entry-dot"></div>

            <rect class="icon-container" width="24" height="24" />
          </svg>
        </div>
      </button>
      <audio id="audio-A" src="https://static.wixstatic.com/mp3/7ec13e_b9f6db2f0cbf4753881415e3c24db0d9.m4a"

  <script>
    // Entry overlay
    var entryOverlay = document.getElementsByClassName("entry-overlay")[0];
    const entryDot = document.getElementById("entry-dot");
    const prompt = document.getElementById("prompt");
    const loadingText = document.getElementById("loading");

    // Dot nav event listeners
    document.getElementById("dot3").addEventListener("click", () => {
      window.parent.location.href = "https://www.rolodex.cc/yc-xd";
    });
    document.getElementById("dot1").addEventListener("click", (event) => {
      event.preventDefault();
      // Navigate to home page
      window.parent.location.href = "https://www.rolodex.cc/rolodex-home"; // Update with your actual home page URL
    });
    document.getElementById("dot2").addEventListener("click", (event) => {
      event.preventDefault();
      // Navigate to about page
      window.parent.location.href = "https://www.rolodex.cc/yc-xd-bio"; // Update with your actual about page URL
    });
    // if current window, then fill in the active dot
    if (window.location.href.includes("bio")) {
      document.getElementById("dot2").style.backgroundColor = "black";
      document.getElementById("dot3").style.backgroundColor = "transparent";
    } else {
      document.getElementById("dot2").style.backgroundColor = "transparent";
      document.getElementById("dot3").style.backgroundColor = "black";
    }

    // Custom audio player
    // A: load sound via <audio> tag
    const audioElement = document.getElementById("audio-A");
    const audioCtx = new AudioContext();
    const track = audioCtx.createMediaElementSource(audioElement);
    // B: load sound via <audio> tag
    const audioElementB = document.getElementById("audio-B");
    const audioCtxB = new AudioContext();
    const trackB = audioCtxB.createMediaElementSource(audioElementB);

    // A:Player controls and attributes
    const playButton = document.getElementById("player-play-btn-A");
    const playIcon = document.getElementById("player-icon-play-A");
    const pauseIcon = document.getElementById("player-icon-pause-A");
    const progress = document.getElementById("player-progress-A");
    const progressFilled = document.getElementById(
      "player-progress-filled-A",
    );
    const playerCurrentTime = document.getElementById(
      "player-time-current-A",
    );
    const playerDuration = document.getElementById("player-time-duration-A");
    const volumeControl = document.getElementById("volume-A");

    // B:Player controls and attributes
    const playButtonB = document.getElementById("player-play-btn-B");
    const playIconB = document.getElementById("player-icon-play-B");
    const pauseIconB = document.getElementById("player-icon-pause-B");
    const progressB = document.getElementById("player-progress-B");
    const progressFilledB = document.getElementById(
      "player-progress-filled-B",
    );
    const playerCurrentTimeB = document.getElementById(
      "player-time-current-B",
    );
    const playerDurationB = document.getElementById("player-time-duration-B");
    const volumeControlB = document.getElementById("volume-B");

    window.addEventListener(
      "load",
      () => {
        // Hide loading text once loading is complete
        loadingText.classList.add("hidden-entry-overlay");
        prompt.classList.remove("hidden-entry-overlay");

        // Hover color change
        entryDot.addEventListener("mouseover", () => {
          entryDot.style.backgroundColor = "#DD5F5F";
        });
        entryDot.addEventListener("mouseout", () => {
          entryDot.style.backgroundColor = "transparent";
        });
        entryDot.addEventListener("click", () => {
          entryOverlay.classList.add("hidden-entry-overlay");
          setTimeout(delayedPlay, 1500);
        });

        function delayedPlay() {
          playAudioFunc("A");
          playAudioFunc("B");
        }

        function playAudioFunc(val) {
          if (val == "A") {
            if (audioCtx.state === "suspended") {
              audioCtx.resume();
            }

            // Play or pause track depending on state
            if (playButton.dataset.playing === "false") {
              audioElement.play();
              playButton.dataset.playing = "true";
              playIcon.classList.add("hidden");
              pauseIcon.classList.remove("hidden");
            } else if (playButton.dataset.playing === "true") {
              audioElement.pause();
              playButton.dataset.playing = "false";
              pauseIcon.classList.add("hidden");
              playIcon.classList.remove("hidden");
            }
          } else if (val == "B") {
            if (audioCtxB.state === "suspended") {
              audioCtxB.resume();
            }

            // Play or pause track depending on state
            if (playButtonB.dataset.playing === "false") {
              audioElementB.play();
              playButtonB.dataset.playing = "true";
              playIconB.classList.add("hidden");
              pauseIconB.classList.remove("hidden");
            } else if (playButtonB.dataset.playing === "true") {
              audioElementB.pause();
              playButtonB.dataset.playing = "false";
              pauseIconB.classList.add("hidden");
              playIconB.classList.remove("hidden");
            }
          }
        }

        // A: Play button toggle
        playButton.addEventListener("click", () => {
          playAudioFunc("A");
        });

        // B: Play button toggle
        playButtonB.addEventListener("click", () => {
          playAudioFunc("B");
        });

        // Update progress bar and time values as audio plays
        audioElement.addEventListener("timeupdate", () => {
          progressUpdate("A");
        });
        audioElementB.addEventListener("timeupdate", () => {
          progressUpdate("B");
        });

        // A: if the track ends reset the player
        audioElement.addEventListener("ended", () => {
          playButton.dataset.playing = "false";
          pauseIcon.classList.add("hidden");
          playIcon.classList.remove("hidden");
          progressFilled.style.flexBasis = "0%";
          audioElement.currentTime = 0;
          audioElement.duration = audioElement.duration;
        });
        audioElementB.addEventListener("ended", () => {
          playButtonB.dataset.playing = "false";
          pauseIconB.classList.add("hidden");
          playIconB.classList.remove("hidden");
          progressFilledB.style.flexBasis = "0%";
          audioElementB.currentTime = 0;
          audioElementB.duration = audioElementB.duration;
        });

        // A: Bridge the gap between gainNode and AudioContext so we can manipulate volume (gain)
        const gainNode = audioCtx.createGain();
        const volumeControl = document.getElementById("volume-A");
        volumeControl.addEventListener("change", () => {
          gainNode.gain.value = volumeControl.value;
        });
        track.connect(gainNode).connect(audioCtx.destination);
        // B: Bridge the gap between gainNode and AudioContext so we can manipulate volume (gain)
        const gainNodeB = audioCtxB.createGain();
        const volumeControlB = document.getElementById("volume-B");
        volumeControlB.addEventListener("change", () => {
          gainNodeB.gain.value = volumeControlB.value;
        });
        trackB.connect(gainNodeB).connect(audioCtxB.destination);

        // Update player timeline progress visually
        function progressUpdate(val) {
          if (val == "A") {
            const percent =
              (audioElement.currentTime / audioElement.duration) * 100;
            progressFilled.style.flexBasis = `${percent}%`;
          } else {
            const percent =
              (audioElementB.currentTime / audioElementB.duration) * 100;
            progressFilledB.style.flexBasis = `${percent}%`;
          }
        }

        // Scrub player timeline to skip forward and back on click for easier UX
        let mousedown = false;
        function scrub(event, val) {
          if (val == "A") {
            const scrubTime =
              (event.offsetX / progress.offsetWidth) * audioElement.duration;
            audioElement.currentTime = scrubTime;
          } else if (val == "B") {
            const scrubTimeB =
              (event.offsetX / progressB.offsetWidth) *
              audioElementB.duration;
            audioElementB.currentTime = scrubTimeB;
          }
        }
        progress.addEventListener("click", scrub);
        progress.addEventListener(
          "mousemove",
          (e) => mousedown && scrub(e, "A"),
        );
        progress.addEventListener("mousedown", () => (mousedown = true));
        progress.addEventListener("mouseup", () => (mousedown = false));

        progressB.addEventListener("click", scrub);
        progressB.addEventListener(
          "mousemove",
          (e) => mousedown && scrub(e, "B"),
        );
        progressB.addEventListener("mousedown", () => (mousedown = true));
        progressB.addEventListener("mouseup", () => (mousedown = false));
      },
      false,
    );

    //Syncing scroll with audio
    document.addEventListener("DOMContentLoaded", () => {
      const audioA = document.getElementById("audio-A");
      const imgA = document.getElementById("img-A");
      const containerA = document.getElementById("lyric-container-A");
      let imgAHeight = 0;
      let containerAHeight = containerA.clientHeight;

      const imgMid = document.getElementById("img-mid");
      const containerMid = document.getElementById("lyric-container-mid");
      let imgMidHeight = 0;
      let containerMidHeight = containerA.clientHeight;

      const audioB = document.getElementById("audio-B");
      const imgB = document.getElementById("img-B");
      const containerB = document.getElementById("lyric-container-B");
      let imgBHeight = 0;
      let containerBHeight = containerB.clientHeight;

      // Update image height after it loads
      imgA.onload = () => {
        imgAHeight =
          imgA.naturalHeight * (imgA.clientWidth / imgA.naturalWidth);
      };
      imgB.onload = () => {
        imgBHeight =
          imgB.naturalHeight * (imgB.clientWidth / imgB.naturalWidth);
      };
      imgMid.onload = () => {
        imgMidHeight =
          imgMid.naturalHeight * (imgMid.clientWidth / imgMid.naturalWidth);
      };

      // Adjust on resize
      window.addEventListener("resize", () => {
        containerBHeight = containerA.clientHeight;
        imgAHeight =
          imgA.naturalHeight * (imgA.clientWidth / imgA.naturalWidth);

        containerBHeight = containerB.clientHeight;
        imgBHeight =
          imgB.naturalHeight * (imgB.clientWidth / imgB.naturalWidth);

        containerMidHeight = containerMid.clientHeight;
        imgMidHeight =
          imgMid.naturalHeight * (imgMid.clientWidth / imgMid.naturalWidth);
      });

      // Sync scroll with audio
      audioA.addEventListener("timeupdate", () => {
        // Make disc A's text disappear on play
        document.getElementById("side-A-text").style.opacity = "0";
        // scroll img as time updates
        if (imgAHeight > containerAHeight) {
          const progress = audioA.currentTime / audioA.duration;
          // const maxScroll = imgAHeight - containerAHeight;
          const scrollY = -progress * imgAHeight;
          imgA.style.transform = `translateY(${scrollY}px)`;
          imgMid.style.transform = `translateY(-${imgMidHeight}px)`;
          imgMid.style.transition = `930s linear`;
        }
      });
      audioB.addEventListener("timeupdate", () => {
        // Make disc B's text disappear on play
        document.getElementById("side-B-text").style.opacity = "0";
        // scroll img as time updates
        if (imgBHeight > containerBHeight) {
          const progress = audioB.currentTime / audioB.duration;
          const maxScroll = imgBHeight - containerBHeight;
          const scrollY = -progress * maxScroll;
          imgB.style.transform = `translateY(${scrollY}px)`;
        }
      });
    });
  </script>
</body>

</html>
