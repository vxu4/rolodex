    <script>
      /**
       * Formats a number to always have two digits (e.g., 5 -> "05")
       */
      function padZero(num) {
        return num.toString().padStart(2, "0");
      }

      /**
       * Updates the UTC clock every second
       */
      function updateUTCClock() {
        try {
          const now = new Date();
          const hours = padZero(now.getUTCHours());
          const minutes = padZero(now.getUTCMinutes());
          const seconds = padZero(now.getUTCSeconds());
          document.getElementById("utcClock").textContent =
            `${hours}:${minutes}:${seconds} UTC`;
        } catch (error) {
          console.error("Error updating UTC clock:", error);
          document.getElementById("utcClock").textContent = "Error";
        }
      }

      // Initial call and set interval for updates
      updateUTCClock();
      setInterval(updateUTCClock, 1000);
    </script>
