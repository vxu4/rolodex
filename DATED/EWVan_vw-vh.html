<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: change name here -->
    <title>Emilia Wee Van</title>
    <style>
      p {
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 200;
        font-size: 14px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        color: black;
      }

      /* Entry overlay: w/ prompt and dot to click in */
      .entry-overlay {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        z-index: 888;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: auto;
        background-color: rgba(247, 247, 237, 0.95);
        opacity: 1; /* Fully visible */
        transition: opacity 1.5s ease; /* Smooth fade-out effect */
      }
      .hidden-entry-overlay {
        opacity: 0;
        pointer-events: none; /* Prevent interaction */
      }
      #entry-dot {
        width: 15px;
        height: 15px;
        background-color: transparent;
        border: 1px solid black;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.5s ease; /* Smooth fade-out effect */
      }
      .prompt-text {
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 14px;
        font-style: normal;
        font-variation-settings: "wdth" 87.5;
        color: black;
      }

      .dot-nav {
        height: 100px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        position: relative;
        padding: 20px;
      }

      .dot {
        position: absolute;
        height: 15px;
        width: 15px;
        background-color: transparent;
        border: 1px solid black;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
      }

      /* Positioning the dots in a triangle formation */
      #dot1 {
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }

      #dot1::after {
        content: "Rolodex Homepage";
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 10px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(10%);
        background-color: black;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        z-index: 15;
      }

      #dot1:hover::after {
        opacity: 1;
      }

      #dot2 {
        top: 60px;
        left: calc(50% - 30px);
      }

      #dot2::after {
        content: "Rolobeing Bio";
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 10px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-110%);
        background-color: black;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        z-index: 15;
      }

      #dot2:hover::after {
        opacity: 1;
      }

      #dot3 {
        top: 60px;
        left: calc(50% + 15px);
        background-color: black;
      }

      #dot3::after {
        content: "Refresh Content";
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 10px;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(10%);
        background-color: black;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
        z-index: 15;
      }

      #dot3:hover::after {
        opacity: 1;
      }

      /* Mobile view only on screens up to 768px wide */
      .mobile-only {
        display: flex;
        width: 100vw;
        height: 100vh;
        z-index: 999;
        position: absolute;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #9e9e9e;
      }

      @media (min-width: 769px) {
        .mobile-only {
          display: none;
        }

      @media (max-width: 769px) {

      .rolodex {

    <script>
      // Entry overlay
      var entryOverlay = document.getElementsByClassName("entry-overlay")[0];
      const entryDot = document.getElementById("entry-dot");
      entryDot.addEventListener("mouseover", () => {
        //TODO: EDIT COLOR HERE
        entryDot.style.backgroundColor = "black";
      });
      entryDot.addEventListener("mouseout", () => {
        entryDot.style.backgroundColor = "transparent";
      });
      entryDot.addEventListener("click", () => {
        entryOverlay.classList.add("hidden-entry-overlay");
      });

      // Dot nav event listeners
      document.getElementById("dot3").addEventListener("click", () => {
        //TODO: EDIT URL HERE
      });
      document.getElementById("dot1").addEventListener("click", (event) => {
        event.preventDefault();
        //TODO: EDIT URL HERE
        // Navigate to home page
        window.parent.location.href = "https://www.rolodex.cc/rolodex-home"; // Update with your actual home page URL
      });
      document.getElementById("dot2").addEventListener("click", (event) => {
        event.preventDefault();
        //TODO: EDIT URL HERE
        // Navigate to about page
        window.parent.location.href = "https://www.rolodex.cc/ewv-bio"; // Update with your actual about page URL
      });
      // if current window, then fill in the active dot
      if (window.location.href.includes("bio")) {
        document.getElementById("dot2").style.backgroundColor = "black";
        document.getElementById("dot3").style.backgroundColor = "transparent";
      } else {
        document.getElementById("dot2").style.backgroundColor = "transparent";
        document.getElementById("dot3").style.backgroundColor = "black";
      }

      /**
       * Formats a number to always have two digits (e.g., 5 -> "05")
       */
      function padZero(num) {
        return num.toString().padStart(2, "0");
      }

      /**
       * Updates the UTC clock every second
       */
      function updateUTCClock() {
        try {
          const now = new Date();
          const hours = padZero(now.getUTCHours());
          const minutes = padZero(now.getUTCMinutes());
          const seconds = padZero(now.getUTCSeconds());
          document.getElementById("utcClock").textContent =
            `${hours}:${minutes}:${seconds} UTC`;
        } catch (error) {
          console.error("Error updating UTC clock:", error);
          document.getElementById("utcClock").textContent = "Error";
        }
      }

      // Initial call and set interval for updates
      updateUTCClock();
      setInterval(updateUTCClock, 1000);
    </script>
