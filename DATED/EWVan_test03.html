<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bounce Image to Beat</title>
    <style>
      body {
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: white;
        font-family: sans-serif;
      }

      img {
        width: 150px;
        transition: transform 0.1s ease;
      }

      /* Bounce effect */
      .bounce {
        transform: scale(1.3);
      }

      audio {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h2>Bounce to the Beat</h2>
    <img
      id="bouncer"
      src="https://static.wixstatic.com/media/2fa7ac_e78ab07b1bcd40f6985cdc3fb216ca26~mv2.jpeg"
      alt="Bouncing Image"
    />
    <audio
      id="audio"
      src="https://static.wixstatic.com/mp3/2fa7ac_08dae341f4c64b48a5d54c5cc99fd674.mp3"
      crossorigin="anonymous"
    ></audio>

    <script>
      (async function () {
        const audioElement = document.getElementById("audio");
        const img = document.getElementById("bouncer");

        // Create audio context and connect audio element
        const audioCtx = new (
          window.AudioContext || window.webkitAudioContext
        )();
        const source = audioCtx.createMediaElementSource(audioElement);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256; // Smaller size = faster response
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        let lastBeatTime = 0;
        const beatCooldown = 0; // ms between beats to avoid over-triggering

        function detectBeat() {
          console.log("hit detect");
          analyser.getByteFrequencyData(dataArray);

          // Calculate average volume
          let sum = 0;
          for (let i = 0; i < bufferLength; i++) {
            sum += dataArray[i];
          }
          const avg = sum / bufferLength;
          console.log(avg);
          const now = performance.now();
          if (avg > 50 && now - lastBeatTime > beatCooldown) {
            triggerBounce();
            lastBeatTime = now;
          }

          requestAnimationFrame(detectBeat);
        }

        function triggerBounce() {
          console.log("bounce triggered");
          img.classList.add("bounce");
          setTimeout(() => img.classList.remove("bounce"), 100);
        }

        // Resume audio context on play (required by browsers)
        img.addEventListener("click", () => {
          console.log("hit play");
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          detectBeat();
          if (audio.paused) {
            audio.play();
            detectBeat();
          } else {
            audio.pause();
            cancelAnimationFrame(detectBeat);
          }
        });
      })();
    </script>
  </body>
</html>
