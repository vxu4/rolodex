<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orbit Visualizations</title>
    <style>
      body {
        background: #111;
        color: #eee;
        font-family: sans-serif;
        text-align: center;
      }
      canvas {
        background: #222;
        display: block;
        margin: 1em auto;
        border: 1px solid #555;
      }
      select {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Orbit Visualizations</h1>
    <canvas id="orbitCanvas" width="800" height="600"></canvas>
    <br />
    <label for="curveSelect">Choose Curve:</label>
    <select id="curveSelect">
      <option value="spiral">Spiral (Archimedean)</option>
      <option value="bezier">Bezier Curve</option>
      <option value="lissajous">Lissajous Curve</option>
    </select>

    <script>
      const canvas = document.getElementById("orbitCanvas");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;

      const curveSelect = document.getElementById("curveSelect");
      curveSelect.addEventListener("change", draw);

      function drawSpiral() {
        ctx.beginPath();
        ctx.strokeStyle = "cyan";
        ctx.lineWidth = 1;

        const a = 0.5;
        const spacing = 0.15;

        for (let t = 0; t < 50 * Math.PI; t += 0.1) {
          const r = a + spacing * t;
          const x = centerX + r * Math.cos(t);
          const y = centerY + r * Math.sin(t);

          if (t === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.stroke();
      }

      function drawBezier() {
        ctx.beginPath();
        ctx.strokeStyle = "orange";
        ctx.lineWidth = 2;

        // Control Points
        const p0 = { x: 100, y: 500 };
        const p1 = { x: 300, y: 100 };
        const p2 = { x: 500, y: 100 };
        const p3 = { x: 700, y: 500 };

        ctx.moveTo(p0.x, p0.y);

        // Cubic Bezier curve equation
        for (let t = 0; t <= 1; t += 0.01) {
          const x =
            Math.pow(1 - t, 3) * p0.x +
            3 * Math.pow(1 - t, 2) * t * p1.x +
            3 * (1 - t) * Math.pow(t, 2) * p2.x +
            Math.pow(t, 3) * p3.x;
          const y =
            Math.pow(1 - t, 3) * p0.y +
            3 * Math.pow(1 - t, 2) * t * p1.y +
            3 * (1 - t) * Math.pow(t, 2) * p2.y +
            Math.pow(t, 3) * p3.y;

          ctx.lineTo(x, y);
        }

        ctx.stroke();
      }

      function drawLissajous() {
        ctx.beginPath();
        ctx.strokeStyle = "lime";
        ctx.lineWidth = 1;

        const A = 200; // amplitude X
        const B = 200; // amplitude Y
        const a = 3; // frequency X
        const b = 2; // frequency Y
        const delta = Math.PI / 2; // phase difference

        for (let t = 0; t <= 2 * Math.PI; t += 0.01) {
          const x = centerX + A * Math.sin(a * t + delta);
          const y = centerY + B * Math.sin(b * t);
          if (t === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.stroke();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        switch (curveSelect.value) {
          case "spiral":
            drawSpiral();
            break;
          case "bezier":
            drawBezier();
            break;
          case "lissajous":
            drawLissajous();
            break;
        }
      }

      // Initial draw
      draw();
    </script>
  </body>
</html>
