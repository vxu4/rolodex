      .solid-circle {

        width: 1.375rem;
        height: 1.375rem;
        border-radius: 50%;
        background-color: black;
        transition:
          opacity 0.6s,
          transform 1.3s ease-in-out;
      }

      .finaldots {
        cursor: pointer;
        position: absolute;
        width: 1.375rem;
        height: 1.375rem;
        border-radius: 50%;
        background-color: black;
        transition: transform 1.3s ease-in-out;
      }

      .o1 {
        /* top: 0; */
        /* left: 1.668rem;

        /* left: -1.66rem;

        /* left: -30px; */
        /* transform: translateX(30px); */
        transform: translateX(-29px);
      }

      .final-dot.clicked {
        background-color: #27000c;
      }

      .hide {
        display: none;
      }

      .hidden {
        opacity: 0;
        transition: opacity 1s;
        z-index: -10;
      }

      .zIndex999 {
        z-index: 999;
      }

      /* .merged {
             transform: translateX(0);
           } */

      .dot {
        width: 1.375rem;
        height: 1.375rem;
        background-color: black;
        border-radius: 50%;
      }

      .rolodex-dot {
        position: absolute;
      }

      /* Toggle styling */
      .toggle {
        font-family: "Noto Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-size: 13px;
        font-style: normal;
        font-variation-settings: "wdth" 87.5;
        color: black;
        display: flex;
        flex-direction: row;
        align-items: center;
        position: absolute;
        right: 1rem;
        top: 1rem;
        transition: opacity 1s;
        z-index: 999;
      }
      /* The box around the toggle */
      .switch {
        position: relative;
        display: inline-block;
        width: 2rem;
        height: 0.9rem;
        margin: 0rem 0.4rem;
      }

      /* Hide default HTML checkbox */
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      /* The slider */
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #9e9e9e;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 0.7rem;
        width: 0.7rem;
        left: 0.1rem;
        bottom: 0.1rem;
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      input:checked + .slider {
        background-color: #9e9e9e;
      }

      input:focus + .slider {
        box-shadow: 0 0 1px #9e9e9e;
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(1.1rem);
        -ms-transform: translateX(1.1rem);
        transform: translateX(1.1rem);
      }

      /* Rounded sliders */
      .slider.round {
        border-radius: 34px;
      }

      .slider.round:before {
        border-radius: 50%;
      }

      /* Responsive adjustments */
      @media (max-width: 600px) {
        .rolodex {
          font-size: 2rem;
        }

        .solid-circle,
        .finaldots {
          width: 1rem;
          height: 1rem;
        }

        .o1 {
          left: 1.25rem;
          transform: translateX(-1.25rem);
        }

        .o2 {
          left: -1.25rem;
          transform: translateX(1.25rem);
        }
        /* .merged {
               transform: translateX(0);
             } */
      }

    <script>
      const rolodex = document.querySelector(".rolodex");
      const dots = document.querySelectorAll(".solid-circle");
      const letters = document.querySelectorAll(".letter:not(.o)");
      const betaTxt = document.getElementById("beta-text");
      const footnote = document.getElementsByClassName("footer")[0];

      const toggle = document.querySelector(".toggle");
      const container = document.querySelector(".dot-container");
      const indexRoloform = document.getElementById("index-roloform");
      const indexRolobeings = document.getElementById("index-rolobeing");
      const rololandContainer = document.querySelector(".rololand-index");
      const rolodexContainer = document.querySelector(".container");

      let hiddenFound = false;
      let executed = false;
      let rololand = false;

      // localStorage.clear();

      //Toggle constatns
      const interactiveText = document.getElementsByClassName(
        "toggle-label-interactive",
      )[0];
      const essayText =
        document.getElementsByClassName("toggle-label-essay")[0];

      // Attach event listeners after DOM loads
      const inputEl = document.getElementById("myInput");

      // If landing page has been displayed before, it is set to true in localstorage, and the landing view is hidden
      // If the toggle state view of rololand/rolodex is set to rololand, display that while generateDots() happens in bg
      if (localStorage.getItem("landing")) {
        letters.forEach((letter) => {
          if (letter.classList.contains("hidden")) {
            hiddenFound = true;
          } else {
            letter.classList.add("hidden");
          }
        });
        betaTxt.classList.add("hidden");
        if (localStorage.getItem("rololand") === "true") {
          inputEl.checked = true;
          localStorage.setItem("rololand", inputEl.checked);
          rololand = localStorage.getItem("rololand") === "true";
          displayRololand();
          setTimeout(generateDots(), 100);
        } else {
          generateDots();
        }
        toggle.classList.remove("hidden");
        document.getElementById("copyright").classList.add("hide");
        document.getElementById("copyright-rolodex").classList.remove("hidden");
      }

      // Adding animation and universe expanding behavior for ROLODEX landing view
      rolodex.addEventListener("click", function () {
        betaTxt.classList.add("hidden");
        footnote.classList.remove("hidden");
        localStorage.setItem("landing", true);
        letters.forEach((letter) => {
          if (letter.classList.contains("hidden")) {
            hiddenFound = true;
          } else {
            letter.classList.add("hidden");
          }
        });

        setTimeout(function () {
          dots[0].classList.add("o1");
          dots[1].classList.add("o2");
        }, 50);

        setTimeout(function () {
          if (!executed) {
            generateDots();
            letters.forEach((letter) => {
              letter.classList.add("hidden");
            });
            document.getElementById("copyright").classList.add("hide");
            document
              .getElementById("copyright-rolodex")
              .classList.remove("hidden");
            toggle.classList.remove("hidden");
          }
        }, 1500);
      });

        // Create and append dots
        for (let i = 0; i < links.length; i++) {
          const dotIsActive = links[i].url != null;
          console.log(dotIsActive);
          const dot = document.createElement("div");
          dot.classList.add("dot");
          //differentiating the dots that should move
          dot.classList.add("rolodex-dot");
          dot.style.display = "block";

          if (dotIsActive) {
            dot.style.cursor = "pointer";
          }

          // Code for getting items from array in localstorage
          dot.style.backgroundColor = localStorage.getItem(links[i].name)
            ? links[i].color
            : "black";

          dot.onclick = () => {
            if (dotIsActive) {
              localStorage.setItem(links[i].name, true);

              window.parent.location.href = links[i].url;
            }
          };

          dot.addEventListener("click", () => {
            if (dotIsActive) {
              localStorage.setItem(links[i].name, true);

              dot.style.backgroundColor = links[i].color;
            }
          });

          dot.addEventListener("mouseover", () => {
            if (dotIsActive) {
              dot.style.backgroundColor = links[i].color;
            }
          });

          dot.addEventListener("mouseout", () => {
            if (dotIsActive) {
              dot.style.backgroundColor = localStorage.getItem(links[i].name)
                ? links[i].color
                : "black";
            }
          });

          //appending dot to rolodex (freeflow world)
          container.appendChild(dot);

          //appending dot to rololand (index)
          const dotIndex = document.createElement("div");
          dotIndex.classList.add("dot");
          dotIndex.style.display = "block";

          if (dotIsActive) {
            dotIndex.style.cursor = "pointer";
          }

          dotIndex.style.backgroundColor = localStorage.getItem(links[i].name)
            ? "black"
            : links[i].color;

          dotIndex.onclick = () => {
            if (dotIsActive) {
              localStorage.setItem(links[i].name, true);
              window.parent.location.href = links[i].url;
            }
          };

          dotIndex.addEventListener("click", () => {
            if (dotIsActive) {
              localStorage.setItem(links[i].name, true);

              dotIndex.style.backgroundColor = "black";
            }
          });
          const rolobeingName = document.createElement("p");
          rolobeingName.textContent = links[i].name;
          rolobeingName.classList.add("index-line-text");
          const rolobeingInfo = document.createElement("div");
          rolobeingInfo.classList.add("index-line");
          rolobeingInfo.appendChild(dotIndex);
          rolobeingInfo.appendChild(rolobeingName);
          if (dotIsActive) {
            rolobeingName.style.cursor = "pointer";
          }
          rolobeingName.onclick = () => {
            if (dotIsActive) {
              localStorage.setItem(links[i].name, true);
              window.parent.location.href = links[i].url;
              rolobeingName.style.cursor = "pointer";
            }
          };

          rolobeingName.addEventListener("click", () => {
            if (dotIsActive) {
              localStorage.setItem(links[i].name, true);

              dotIndex.style.backgroundColor = "black";
            }
          });
          if (links[i].category === "roloform") {
            indexRoloform.appendChild(rolobeingInfo);
          } else if (links[i].category === "rolobeing") {
            indexRolobeings.appendChild(rolobeingInfo);
          }
        }

        const dots = document.querySelectorAll(".rolodex-dot");

        // Set initial position
        dots.forEach((dot) => {
          dot.style.top = "50%";
          dot.style.left = "50%";
          dot.style.transition = "none";
          dot.style.transform = `translate(-50%, -50%) rotate(${
            Math.random() * 360
          }deg)`;
        });

        void dots[0].offsetWidth; // force reflow

        // --- movement logic based on screen size ---
        function moveDot(dot) {
          const screenWidth = window.innerWidth;
          const screenHeight = window.innerHeight;

          const maxDistanceX = screenWidth * 0.4; // max 40% of screen width
          const maxDistanceY = screenHeight * 0.4; // max 40% of screen height

          const angle = Math.random() * Math.PI * 2;
          const translateX = Math.cos(angle) * maxDistanceX;
          const translateY = Math.sin(angle) * maxDistanceY;

          dot.style.transition = "transform 15s linear";
          dot.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${
            Math.random() * 360
          }deg)`;
        }

        // Move and animate dots
        dots.forEach((dot) => {
          moveDot(dot); // first move

          dot.addEventListener("transitionend", () => {
            moveDot(dot); // move again when finished
          });

          // Hover pause/resume
          dot.addEventListener("mouseover", () => {
            const computedStyle = window.getComputedStyle(dot);
            const matrix = new WebKitCSSMatrix(computedStyle.transform);
            dot.style.transition = "none";
            dot.style.transform = `translate(${matrix.m41}px, ${
              matrix.m42
            }px) rotate(${Math.random() * 360}deg)`;
          });

          dot.addEventListener("mouseout", () => {
            moveDot(dot);
          });
        });

        // Hide static dots from rolodex title
        finaldots.forEach((element) => {
          element.style.backgroundColor = "transparent";
          if (document.querySelector(".o1")) {
            document.querySelector(".o1").style.backgroundColor = "transparent";
            document.querySelector(".o2").style.backgroundColor = "transparent";
          }
        });
        document.getElementsByClassName(
          "solid-circle",
        )[0].style.backgroundColor = "transparent";
        document.getElementsByClassName(
          "solid-circle",
        )[1].style.backgroundColor = "transparent";

        // On screen resize, re-trigger motion to adjust to new screen size
        window.addEventListener("resize", () => {
          dots.forEach((dot) => {
            moveDot(dot); // adapt to new screen dimensions
          });
        });
      }

      // Trigger when input gets focus (selected)
      inputEl.addEventListener("click", onInputSelected);

      // Function to run when input is selected (focused)
      function onInputSelected() {
        rololand = !rololand;
        if (rololand) {
          displayRololand();
        } else {
          displayRolodex();
        }
      }

      // Function to display the rololand index view
      function displayRololand() {
        localStorage.setItem("rololand", rololand);
        essayText.classList.add("italic");
        interactiveText.classList.remove("italic");
        rololandContainer.classList.remove("hidden");
        rolodexContainer.classList.remove("zIndex900");
        rolodexContainer.classList.add("hidden");
        rololandContainer.classList.add("zIndex900");
        dots.forEach((dot) => {
          dot.classList.add("hidden"); // making dots invisible, but allowing animation to continue
        });
      }

      // Function to display the rolodex moving dot universe view
      function displayRolodex() {
        localStorage.setItem("rololand", false);
        essayText.classList.remove("italic");
        interactiveText.classList.add("italic");
        rololandContainer.classList.add("hidden");
        rolodexContainer.classList.add("zIndex900");
        rolodexContainer.classList.remove("hidden");
        rololandContainer.classList.remove("zIndex900");
        dots.forEach((dot) => {
          dot.classList.remove("hidden"); // making dots invisible, but allowing animation to continue
        });
      }
